name: Deploy SmartMed Cycle

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: SAM build
        run: sam build --template infra/template.yaml

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name smartmed-cycle \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-5 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Inject Lambda URLs into frontend and sync to S3
        run: |
          get_output() {
            aws cloudformation describe-stacks --stack-name smartmed-cycle \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }

          URL=$(get_output ExtractfromPhotoUrl)
          sed -i "s|__URL_EXTRACT_FROM_PHOTO__|$URL|g" frontend/app.js

          URL=$(get_output MedicineCardUrl)
          sed -i "s|__URL_MEDICINE_CARD__|$URL|g" frontend/app.js

          URL=$(get_output MyMedicineSummaryUrl)
          sed -i "s|__URL_MY_MEDICINE_SUMMARY__|$URL|g" frontend/app.js

          URL=$(get_output MyReturnPlanUrl)
          sed -i "s|__URL_MY_RETURN_PLAN__|$URL|g" frontend/app.js

          URL=$(get_output SmartMedHelpUrl)
          sed -i "s|__URL_SMARTMED_HELP__|$URL|g" frontend/app.js

          BUCKET=$(get_output BucketName)
          aws s3 sync frontend/ "s3://$BUCKET" --cache-control no-cache

      - name: Print website URL
        run: |
          aws cloudformation describe-stacks --stack-name smartmed-cycle \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteUrl'].OutputValue" --output text
